name: Fix Pass 1 Role Pages
on:
  push:
    branches: [agent/pass-1-recruiter-conversion]
    paths:
      - scripts/fix_role_links.py
      - .github/workflows/fix-role-links.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pass-1-recruiter-conversion
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fix_role_links.py
      - run: rm -f scripts/fix_role_links.py .github/workflows/fix-role-links.yml
      - name: Commit corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Polish recruiter role pages"
          git push origin HEAD:agent/pass-1-recruiter-conversion
