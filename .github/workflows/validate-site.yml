name: Validate portfolio

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate HTML structure and local links
        id: site_validation
        continue-on-error: true
        run: python scripts/validate_site.py

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install browser-test dependencies
        id: npm_install
        continue-on-error: true
        run: npm install --no-audit --no-fund

      - name: Install Playwright browsers
        id: browser_install
        if: steps.npm_install.outcome == 'success'
        continue-on-error: true
        run: npx playwright install --with-deps chromium webkit

      - name: Run Meeting Intelligence browser acceptance tests
        id: browser_validation
        if: steps.npm_install.outcome == 'success' && steps.browser_install.outcome == 'success'
        continue-on-error: true
        run: npm run test:browser

      - name: Upload Playwright report
        if: ${{ !cancelled() && steps.browser_validation.outcome != 'skipped' }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish validation commit statuses
        if: always() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const staticPassed = '${{ steps.site_validation.outcome }}' === 'success';
            const npmPassed = '${{ steps.npm_install.outcome }}' === 'success';
            const installPassed = '${{ steps.browser_install.outcome }}' === 'success';
            const testPassed = '${{ steps.browser_validation.outcome }}' === 'success';
            const browserPassed = npmPassed && installPassed && testPassed;
            const passed = staticPassed && browserPassed;
            const targetUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;

            const common = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              target_url: targetUrl
            };

            await github.rest.repos.createCommitStatus({
              ...common,
              state: staticPassed ? 'success' : 'failure',
              context: 'portfolio/static',
              description: staticPassed
                ? 'HTML structure and local links passed'
                : 'Static structure or local-link validation failed'
            });

            await github.rest.repos.createCommitStatus({
              ...common,
              state: browserPassed ? 'success' : 'failure',
              context: 'portfolio/browser',
              description: browserPassed
                ? 'Desktop and mobile MVP browser tests passed'
                : `Browser validation failed: npm=${npmPassed}, browsers=${installPassed}, tests=${testPassed}`
            });

            await github.rest.repos.createCommitStatus({
              ...common,
              state: passed ? 'success' : 'failure',
              context: 'portfolio/validation',
              description: passed
                ? 'Static and browser acceptance tests passed'
                : 'Portfolio validation failed; inspect the Actions run'
            });

      - name: Fail workflow when validation fails
        if: steps.site_validation.outcome != 'success' || steps.npm_install.outcome != 'success' || steps.browser_install.outcome != 'success' || steps.browser_validation.outcome != 'success'
        run: exit 1
