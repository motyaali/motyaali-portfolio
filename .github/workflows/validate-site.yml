name: Validate portfolio

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate HTML structure and local links
        id: site_validation
        continue-on-error: true
        run: python scripts/validate_site.py

      - name: Publish validation commit status
        if: always() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ steps.site_validation.outcome }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'portfolio/validation',
              description: passed
                ? 'HTML structure and local links passed'
                : 'HTML structure or local-link validation failed'
            });

      - name: Fail workflow when validation fails
        if: steps.site_validation.outcome != 'success'
        run: exit 1
