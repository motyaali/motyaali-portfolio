name: Validate portfolio

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: portfolio-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate HTML structure and local links
        id: site_validation
        run: python scripts/validate_site.py

      - name: Validate approved public copy and claims
        id: claims_validation
        run: python scripts/validate_public_claims.py

      - name: Validate public proof packs
        id: proof_validation
        run: python scripts/validate_proof_packs.py

      - name: Validate offer conversion package
        id: offer_validation
        run: python scripts/validate_offer_conversion.py

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install browser-test dependencies
        id: npm_install
        run: npm install --no-audit --no-fund

      - name: Install Playwright browsers
        id: browser_install
        run: npx playwright install --with-deps chromium webkit

      - name: Run portfolio browser acceptance tests
        id: browser_validation
        run: npm run test:browser

      - name: Upload Playwright report
        if: ${{ !cancelled() && steps.browser_validation.outcome != 'skipped' }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish validation commit statuses
        if: always() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const sitePassed = '${{ steps.site_validation.outcome }}' === 'success';
            const claimsPassed = '${{ steps.claims_validation.outcome }}' === 'success';
            const proofPassed = '${{ steps.proof_validation.outcome }}' === 'success';
            const offerPassed = '${{ steps.offer_validation.outcome }}' === 'success';
            const staticPassed = sitePassed && claimsPassed && proofPassed && offerPassed;
            const npmPassed = '${{ steps.npm_install.outcome }}' === 'success';
            const installPassed = '${{ steps.browser_install.outcome }}' === 'success';
            const testPassed = '${{ steps.browser_validation.outcome }}' === 'success';
            const browserPassed = npmPassed && installPassed && testPassed;
            const passed = staticPassed && browserPassed;
            const targetUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;

            const common = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              target_url: targetUrl
            };

            await github.rest.repos.createCommitStatus({
              ...common,
              state: staticPassed ? 'success' : 'failure',
              context: 'portfolio/static',
              description: staticPassed
                ? 'HTML, claims, proof packs, and offer conversion passed'
                : `Static validation failed: site=${sitePassed}, claims=${claimsPassed}, proof=${proofPassed}, offer=${offerPassed}`
            });

            await github.rest.repos.createCommitStatus({
              ...common,
              state: browserPassed ? 'success' : 'failure',
              context: 'portfolio/browser',
              description: browserPassed
                ? 'Desktop and mobile browser tests passed'
                : `Browser validation failed: npm=${npmPassed}, browsers=${installPassed}, tests=${testPassed}`
            });

            await github.rest.repos.createCommitStatus({
              ...common,
              state: passed ? 'success' : 'failure',
              context: 'portfolio/validation',
              description: passed
                ? 'Static, proof-pack, offer, and browser acceptance tests passed'
                : 'Portfolio validation failed; inspect the Actions run'
            });
