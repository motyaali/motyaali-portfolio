name: Build LinkedIn media and project page

on:
  push:
    branches:
      - main
    paths:
      - "tools/build_linkedin_media.py"
      - ".github/workflows/build-linkedin-media.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-media:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image dependency
        run: python -m pip install --disable-pip-version-check pillow

      - name: Generate page, social images, and metadata
        run: python tools/build_linkedin_media.py

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html projects/ai-workflow-enablement.html ai-workflow-enablement/index.html assets/social/*.png
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Build AI Workflow Enablement media page"
            git push
          fi
