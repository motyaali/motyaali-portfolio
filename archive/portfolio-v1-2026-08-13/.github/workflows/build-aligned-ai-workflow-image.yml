name: Build website-aligned AI Workflow image

on:
  push:
    branches:
      - main
    paths:
      - "tools/build_aligned_ai_workflow_image.py"
      - ".github/workflows/build-aligned-ai-workflow-image.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Generate website-aligned project image
        run: python tools/build_aligned_ai_workflow_image.py

      - name: Commit generated image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/social/ai-workflow-enablement-linkedin.png
          if git diff --cached --quiet; then
            echo "No generated image change to commit."
          else
            git commit -m "Replace AI Workflow image with website-aligned design"
            git push
          fi
